# ─── Root Query ──────────────────────────────────────────────────────────────────

type Query {
  # Admin
  getOneAdmin(id: String): Admin
  getAllAdmin(input: PaginationArgsInput): PaginatedAdmin
  adminGetMe: Admin

  # Agency
  getOneAgency(id: String): Agency
  getAllAgency(input: PaginationArgsInput): PaginatedAgency

  # AgencyAccount
  getOneAgencyAccount(id: String): AgencyAccount
  getAllAgencyAccount(input: PaginationArgsInput): PaginatedAgencyAccount
  agencyAccountGetMe: AgencyAccount
  generateTokenAgencyAccount(agencyAccountId: String): AgencyAccountLoginData

  # Brand
  getBrandConfig(domain: String): Brand
  getBrands: [Brand]
  getAllBrand(input: PaginationArgsInput): PaginatedBrand
  getOneBrand(id: String): Brand

  # CodeConfig
  getOneCodeConfig(id: String): CodeConfig
  getAllCodeConfig(input: PaginationArgsInput): PaginatedCodeConfig
  getMyCodeConfigs: [CodeConfig]

  # Customer
  getOneCustomer(id: String): Customer
  getAllCustomer(input: PaginationArgsInput): PaginatedCustomer

  # EmailConfig
  getOneEmailConfig(id: String): EmailConfig
  getAllEmailConfig(input: PaginationArgsInput): PaginatedEmailConfig

  # GrantableResource
  getGrantableResources(input: GrantableResourceInput): GrantableResourceResult

  # MediaSet
  getOneMediaSet(id: String): MediaSet
  getAllMediaSet(input: PaginationArgsInput): PaginatedMediaSet

  # Merchant
  getOneMerchant(id: String): Merchant
  getAllMerchant(input: PaginationArgsInput): PaginatedMerchant
  merchantGetMe: Merchant
  myAssignments: MerchantAssignments

  # MerchantInvitation
  getOneMerchantInvitation(id: String): MerchantInvitation
  getAllMerchantInvitation(input: PaginationArgsInput): PaginatedMerchantInvitation
  getAgencyInvitations(input: PaginationArgsInput): PaginatedMerchantInvitation
  getTenantInvitations(input: PaginationArgsInput): PaginatedMerchantInvitation
  getMyInvitations(input: PaginationArgsInput): PaginatedMerchantInvitation
  getInvitationByCode(inviteCode: String): MerchantInvitation
  validateInviteCode(inviteCode: String): MerchantInvitation

  # SystemConfig
  getSystemConfig: SystemConfig

  # Tenant
  getMyTenant: Tenant
  getOneTenant(id: String): Tenant
  getAllTenant(input: PaginationArgsInput): PaginatedTenant

  # TenantAccount
  getMyTenantAccount: TenantAccount
  getOneTenantAccount(id: String): TenantAccount
  getAllTenantAccount(input: PaginationArgsInput): PaginatedTenantAccount
  tenantAccountGetMe: TenantAccount
  generateTokenTenantAccount(tenantAccountId: String): TenantAccountLogin

  # TenantStaffSetting
  getMyTenantStaffSetting: TenantStaffSetting
  getPublicTenantStaffSetting(tenantCode: String): PublicTenantStaffSetting

  # Unit
  getOneUnit(id: String): Unit
  getAllUnit(input: PaginationArgsInput): PaginatedUnit

  # AccountPermission
  getMyPermissions: AccountPermissionSummary
  getAccountPermissions(tenantAccountId: String): AccountPermissionSummary
  getPermissionGroups: [PermissionGroup]

  # ActivityLog
  getAllActivityLog(input: PaginationArgsInput): PaginatedActivityLog
  getEntityActivityTimeline(entityType: String, entityId: String): [ActivityLog]
}

# ─── Root Mutation ────────────────────────────────────────────────────────────────

type Mutation {
  # Admin
  loginAdmin(data: LoginInput): AdminLoginData
  createAdmin(data: CreateAdminInput): Admin
  updateAdmin(id: String, data: UpdateAdminInput): Admin
  deleteAdmin(id: String): Mixed
  adminChangePassword(input: ChangePasswordInput): Mixed
  adminResetPassword(input: ResetPasswordInput): Mixed
  adminResetMerchantPassword(input: ResetPasswordInput): Mixed
  adminForgotPassword(input: ForgotPasswordInput): Mixed
  adminResetPasswordByToken(input: ForgotPasswordResetInput): Mixed

  # Agency
  createAgency(data: CreateAgencyInput): Agency
  updateAgency(id: String, data: UpdateAgencyInput): Agency
  deleteAgency(id: String): Mixed

  # AgencyAccount
  loginAgencyAccount(data: LoginInput): AgencyAccountLoginData
  createAgencyAccount(data: CreateAgencyAccountInput): AgencyAccount
  updateAgencyAccount(id: String, data: UpdateAgencyAccountInput): AgencyAccount
  deleteAgencyAccount(id: String): Mixed
  agencyAccountChangePassword(input: ChangePasswordInput): Mixed

  # Brand
  createBrand(data: CreateBrandInput): Brand
  updateBrand(id: String, data: UpdateBrandInput): Brand
  deleteBrand(id: String): Boolean
  setDefaultBrand(id: String): Brand

  # CodeConfig
  upsertCodeConfig(data: CreateCodeConfigInput): CodeConfig

  # Customer
  deleteCustomer(id: String): Mixed

  # EmailConfig
  createEmailConfig(data: CreateEmailConfigInput): EmailConfig
  updateEmailConfig(id: String, data: UpdateEmailConfigInput): EmailConfig
  deleteEmailConfig(id: String): Mixed
  testEmailConfig(id: String): Mixed

  # Media
  createMedia(input: CreateMediaInput): Media
  updateMedia(id: String, input: UpdateMediaInput): Media
  generatePresignedUrl(input: GeneratePresignedUrlInput): PresignedUrlResult

  # MediaSet
  createMediaSet(data: CreateMediaSetInput): MediaSet
  updateMediaSet(id: String, input: UpdateMediaSetInput): MediaSet
  deleteMediaSet(id: String): Mixed

  # Merchant
  createMerchant(data: CreateMerchantInput): Merchant
  updateMerchant(id: String, data: UpdateMerchantInput): Merchant
  registerMerchant(input: RegisterMerchantInput): MerchantLogin
  merchantLogin(input: MerchantLoginInput): MerchantLogin
  registerByInvite(input: RegisterByInviteInput): MerchantLogin
  registerAndJoinTenant(input: RegisterAndJoinTenantInput): RegisterAndJoinResult
  switchToAgency(input: SwitchAgencyInput): AgencyAccountLoginData
  switchToTenant(input: SwitchTenantInput): TenantAccountLogin
