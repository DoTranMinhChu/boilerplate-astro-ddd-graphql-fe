name: CI

on:
  # `master`, not `main`, is this repo's actual default branch — `pull_request` (no branch
  # filter below) already validates every PR before it merges into master, but without
  # `master` here a direct push/merge to master triggers no post-merge CI run at all.
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (oxlint)
        # Runs first — fast and deterministic, so a bad import (e.g. core/ reaching into
        # shared/modules) fails fast instead of waiting behind build/test.
        run: npm run lint

      - name: Build (astro check && astro build)
        run: npm run build
        env:
          SITE_URL: https://example.com

      - name: Test (vitest)
        run: npm test

  # ─────────────────────────────────────────────────────────────────────────────
  # GraphQL codegen drift check
  #
  # WHAT THIS DOES
  #   `npm run gengraph` (scripts/generate-graph.mjs) regenerates
  #   src/shared/generated/{schema.graphql,typed-graphql.ts} from a LIVE GraphQL
  #   introspection query against a running backend. Until this job existed that only ever
  #   happened by hand, against whichever backend a developer happened to have running — so
  #   the generated files checked in here could silently fall behind the real backend schema
  #   and nothing would notice until runtime.
  #
  #   This job starts a throwaway Postgres plus a real backend built from the BE repo,
  #   regenerates the codegen against it, and fails if the result differs from what is
  #   checked in. A failure means someone changed the backend GraphQL schema and did not
  #   re-run `npm run gengraph` here; the fix is to run it and commit the result.
  #
  #   It is a separate job from build-and-test on purpose: it needs none of the lint/build/
  #   test output, so running it in parallel keeps fast feedback on unrelated PRs.
  #
  # WHY THE COMPARISON IS NORMALIZED INSTEAD OF `git diff --exit-code`
  #   The backend builds its schema by globbing resolver files (see `glob(...)` in the BE's
  #   src/core/infrastructure/http/graphQLSchema.loader.ts — no sort option), so the ORDER of
  #   types and fields in the introspected schema follows filesystem walk order. That order is
  #   not stable across environments: regenerating against the SAME backend source on one
  #   machine produced ~3k reordered lines when the backend ran from dist/ and ~4k reordered
  #   lines when it ran from src/ — with zero content differences in either case. A
  #   byte-for-byte `git diff --exit-code -- src/shared/generated/` would therefore fail on
  #   essentially every run, for reasons that have nothing to do with drift.
  #
  #   So the gate below compares the checked-in schema.graphql against the freshly generated
  #   one after putting both through graphql-js `lexicographicSortSchema`, which is
  #   order-insensitive and compares the actual contract.
  #
  #   typed-graphql.ts is NOT compared this same live-vs-live way — it inherits the identical
  #   unstable ordering from the live-introspected schema (even a sorted-line comparison of it
  #   still showed 38 pure-ordering differences), so a byte comparison against a freshly
  #   generated copy would fail on ordering noise the same way schema.graphql's would.
  #
  #   Instead there is a SEPARATE gate further down ("Fail on typed-graphql.ts drift") that
  #   regenerates typed-graphql-builder's output from the COMMITTED schema.graphql (not the
  #   live one) and byte-compares it against the committed typed-graphql.ts. Because the
  #   committed file's byte order is fixed, that comparison is deterministic without needing a
  #   sort step. It catches what schema equivalence alone does NOT: a typed-graphql-builder
  #   version bump, or an edit to scripts/generate-graph.mjs's scalar-override/query-overload
  #   patching logic, that leaves the committed typed-graphql.ts stale even though
  #   schema.graphql itself is still perfectly in sync. It does NOT (and cannot) independently
  #   catch typed-graphql.ts drifting from a schema.graphql that is ALSO out of date — the
  #   schema-drift gate above runs first and already fails the job in that case, before the
  #   typed-graphql.ts gate is even reached.
  #
  #   PERMANENT FIX (not done here — it spans both repos): make the ordering deterministic,
  #   either by sorting the resolver glob in the backend loader or by applying
  #   `lexicographicSortSchema` inside scripts/generate-graph.mjs before writing the SDL, then
  #   re-committing the generated files. After that this job could collapse back to a plain
  #   `git diff --exit-code -- src/shared/generated/`.
  #
  # VERIFICATION LIMITATION — READ THIS IF THIS JOB IS FAILING AND YOU ARE CONFUSED
  #   This workflow was authored WITHOUT ever being executed by GitHub Actions: at the time it
  #   was written this repo had not been pushed to its origin remote, so the pipeline could not
  #   be triggered even once. What WAS verified is every individual command below, run by hand
  #   on a developer machine against a real local backend and Postgres — the migration command,
  #   the backend build and start, the readiness retry-loop, `npm run gengraph`, and the drift
  #   comparison in BOTH directions (passing while in sync; failing with a precise one-line diff
  #   after a throwaway field was added to a backend resolver). What could NOT be exercised is
  #   the GitHub-specific scaffolding: the `services:` Postgres container, the second
  #   `actions/checkout`, and survival of the backgrounded backend process across steps. Treat a
  #   first-run failure in those areas as an authoring bug in this job rather than as real
  #   schema drift — the drift comparison itself is proven.
  # ─────────────────────────────────────────────────────────────────────────────
  graphql-codegen-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # Base set copied from the BE repo's own .github/workflows/ci.yml (same variable NAMES:
      # JWT_SECRET, ENCRYPTION_SECRET, DB_*). That only proves the SHAPE is right, though — BE's
      # own CI has no `services:` Postgres container and never runs a migration or starts the
      # server (build + typecheck + jest only), so it never actually opens a DB connection with
      # these values. What proves the VALUES below are sufficient is this job itself: DB_*
      # matches the `services.postgres` block a few lines down, and JWT_SECRET /
      # ENCRYPTION_SECRET satisfy BE's own required-env-vars check (BE src/config/env.config.ts
      # throws on a missing one) — both exercised for real by "Run backend migrations" and
      # "Start backend" below. The values themselves are throwaway CI-only strings.
      NODE_ENV: test
      JWT_SECRET: ci-only-jwt-secret-not-for-production
      ENCRYPTION_SECRET: ci-only-encryption-secret-not-for-production
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: app_db
      # NODE_ENV=test already leaves introspection enabled (the BE only disables it when
      # NODE_ENV=production), but set it explicitly so this job does not silently break if
      # that default ever changes — without introspection, gengraph cannot fetch anything.
      ENABLE_GRAPHQL_INTROSPECTION: 'true'
      # NODE_ENV=test also keeps TypeORM synchronize() off, so the schema comes from the
      # migrations run below rather than from entity auto-sync.
      PORT: '3000'
      BACKEND_URL: http://localhost:3000

    services:
      postgres:
        # Matches the Postgres major version this project is developed against locally (17.x).
        # The stock image is enough: the BE's postgis and pgvector migrations check
        # pg_available_extensions first and skip when the binaries are absent, and the
        # unaccent / pg_trgm extensions its LCU migration does need ship with this image.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: fe

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          # Default branch of the backend repo — that is what "the real backend schema" means.
          repository: DoTranMinhChu/boilerplate-express-ddd-graphql-be
          path: be
          # The automatic GITHUB_TOKEN is scoped to THIS repository only. While the backend
          # repo is public the fallback works as-is; if it is ever made private this checkout
          # starts 404ing until a PAT with read access to it is added as the BE_REPO_TOKEN
          # repository secret.
          token: ${{ secrets.BE_REPO_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            fe/package-lock.json
            be/package-lock.json

      - name: Install backend dependencies
        working-directory: be
        run: npm ci

      - name: Build backend
        working-directory: be
        run: npm run build

      - name: Run backend migrations
        working-directory: be
        # Explicit, so a broken migration fails here with a clear message instead of inside
        # the backend's own boot sequence (initializeDatabase() also calls runMigrations(),
        # which then finds nothing pending).
        run: npm run migration:run

      - name: Start backend
        working-directory: be
        # Backgrounded with output redirected to a file — without the redirect the step can
        # hang holding the runner's stdout. The process outlives this step; nothing kills it
        # explicitly, and nothing needs to — GitHub Actions runners are ephemeral per-job (torn
        # down entirely once the job ends), and no other step or job in this pipeline (nor the
        # BE repo's own CI) does explicit background-process cleanup either. (A pid file used
        # to be written here for a since-removed cleanup step; it is gone because nothing ever
        # read it, and `$!` after `npm start &` would only have captured the `npm` wrapper's
        # PID anyway, not the actual `node dist/server.js` process — the same trap that caused
        # a false-negative EADDRINUSE during this job's own local verification.)
        run: npm start > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Wait for the backend GraphQL endpoint
        # Polls the endpoint gengraph actually uses, rather than /health or a fixed sleep:
        # this is the exact capability the next step depends on.
        run: |
          ready=""
          for i in $(seq 1 90); do
            if curl -sf -o /dev/null -X POST "$BACKEND_URL/graphql" \
                 -H "Content-Type: application/json" \
                 --data "{\"query\":\"{ __typename }\"}"; then
              ready="yes"
              echo "Backend GraphQL endpoint ready after ${i} attempt(s)."
              break
            fi
            sleep 2
          done
          if [ -z "$ready" ]; then
            echo "::error::Backend did not start accepting GraphQL requests within 180s."
            exit 1
          fi

      - name: Install frontend dependencies
        working-directory: fe
        run: npm ci

      - name: Snapshot the checked-in codegen output
        working-directory: fe
        # gengraph overwrites both generated files in place, so keep the committed copies
        # first: schema.graphql feeds the schema-drift gate below, and typed-graphql.ts feeds
        # the separate typed-graphql.ts drift gate further down.
        run: |
          cp src/shared/generated/schema.graphql "$RUNNER_TEMP/committed-schema.graphql"
          cp src/shared/generated/typed-graphql.ts "$RUNNER_TEMP/committed-typed-graphql.ts"

      - name: Regenerate GraphQL codegen against the live backend
        working-directory: fe
        run: npm run gengraph

      - name: Fail on schema drift
        working-directory: fe
        # The comparer lives inside the frontend checkout so `require('graphql')` resolves
        # through its node_modules (graphql is a runtime dependency of this repo).
        run: |
          cat > codegen-drift-compare.cjs <<'CJS'
          const fs = require('fs');
          const { buildSchema, lexicographicSortSchema, printSchema } = require('graphql');

          const [committedPath, regeneratedPath, outCommitted, outRegenerated] = process.argv.slice(2);
          const normalize = (p) =>
            printSchema(lexicographicSortSchema(buildSchema(fs.readFileSync(p, 'utf8'))));

          let committed, regenerated;
          try {
            committed = normalize(committedPath);
            regenerated = normalize(regeneratedPath);
          } catch (err) {
            // A crash here means one of the two files was not valid GraphQL SDL at all — e.g.
            // the live backend's introspection response was empty/malformed, or the committed
            // file is corrupted. That is NOT "drift" (drift means two well-formed schemas
            // disagree), so signal it with a distinct exit code and let the caller print a
            // distinct, non-confusing message instead of the normal drift remediation.
            console.error('PARSE_ERROR: could not parse one of the schemas as valid GraphQL SDL.');
            console.error(err.message);
            process.exit(2);
          }

          fs.writeFileSync(outCommitted, committed);
          fs.writeFileSync(outRegenerated, regenerated);

          if (committed === regenerated) {
            console.log('OK: checked-in schema.graphql is semantically identical to the live backend schema.');
            process.exit(0);
          }
          console.error('DRIFT: checked-in schema.graphql does NOT match the live backend schema.');
          process.exit(1);
          CJS

          set +e
          node codegen-drift-compare.cjs \
               "$RUNNER_TEMP/committed-schema.graphql" \
               src/shared/generated/schema.graphql \
               "$RUNNER_TEMP/normalized-committed.graphql" \
               "$RUNNER_TEMP/normalized-regenerated.graphql"
          compare_exit=$?
          set -e

          if [ "$compare_exit" -eq 0 ]; then
            exit 0
          fi

          if [ "$compare_exit" -eq 2 ]; then
            echo "::error::Could not parse one of the GraphQL schemas as valid SDL — this looks like a backend/introspection problem, not codegen drift. Check the 'Wait for the backend GraphQL endpoint' and 'Regenerate GraphQL codegen against the live backend' step logs above for the underlying cause."
            exit 1
          fi

          echo "::error::src/shared/generated/ is out of date. Run 'npm run gengraph' against the backend and commit the result."
          echo "--- normalized schema diff (checked-in -> live backend) ---"
          diff -u "$RUNNER_TEMP/normalized-committed.graphql" \
                  "$RUNNER_TEMP/normalized-regenerated.graphql" || true
          exit 1

      - name: Fail on typed-graphql.ts drift
        working-directory: fe
        # Regenerates typed-graphql-builder's output from the COMMITTED schema.graphql (not the
        # freshly live-introspected one — see the job comment above for why) and byte-compares
        # it against the committed typed-graphql.ts. This is what actually verifies the
        # committed typed-graphql.ts still matches the committed schema.graphql; schema
        # equivalence above does not imply this on its own (a typed-graphql-builder version
        # bump, or an edit to scripts/generate-graph.mjs's patching logic, could leave
        # typed-graphql.ts stale while the schema-drift gate above stays green).
        run: |
          cat > typed-graphql-drift-compare.cjs <<'CJS'
          const fs = require('fs');
          const path = require('path');
          const { execSync } = require('child_process');
          const { buildSchema } = require('graphql');

          const [committedSchemaPath, referenceOutputPath] = process.argv.slice(2);

          let queryTypeName, mutationTypeName, subscriptionTypeName;
          try {
            const schema = buildSchema(fs.readFileSync(committedSchemaPath, 'utf8'));
            queryTypeName = schema.getQueryType()?.name;
            mutationTypeName = schema.getMutationType()?.name;
            subscriptionTypeName = schema.getSubscriptionType()?.name;
          } catch (err) {
            console.error('PARSE_ERROR: could not parse the committed schema.graphql as valid GraphQL SDL.');
            console.error(err.message);
            process.exit(2);
          }

          // Mirrors scripts/generate-graph.mjs's --scalar argument construction exactly, so
          // the reference output below is built with the same scalar list the real generator
          // uses against a live backend.
          const scalarsPath = path.join(process.cwd(), 'src/core/config/scalars.txt');
          let scalarArgs = '';
          if (fs.existsSync(scalarsPath)) {
            scalarArgs = fs.readFileSync(scalarsPath, 'utf8')
              .split('\n')
              .map((line) => line.trim())
              .filter((line) => line !== '')
              .map((line) => `--scalar ${line}`)
              .join(' ');
          }

          try {
            // npx (not a bare `typed-graphql-builder` command): unlike scripts/generate-graph.mjs,
            // which only works because npm run gengraph prepends node_modules/.bin to PATH, this
            // script is invoked directly via `node`, so PATH has no local devDependency binaries
            // on it. npx resolves the project's local devDependency binary directly.
            execSync(
              `npx typed-graphql-builder --schema ${committedSchemaPath} --output ${referenceOutputPath} ${scalarArgs}`,
              { stdio: 'inherit' },
            );
          } catch (err) {
            console.error('BUILDER_ERROR: typed-graphql-builder failed to run against the committed schema.graphql.');
            process.exit(2);
          }

          // From here down this is a byte-for-byte copy of the post-processing
          // scripts/generate-graph.mjs applies to its own output, so the reference file this
          // produces is directly comparable to the committed src/shared/generated/typed-graphql.ts.
          // There is no shared module between the two today (see the "moving the heredoc
          // comparer script to a committed file" backlog item) — if generate-graph.mjs's
          // patching logic changes, this copy must change with it.
          const operations = [
            queryTypeName && 'query',
            mutationTypeName && 'mutation',
            subscriptionTypeName && 'subscription',
          ].filter(Boolean);

          let fileContent = fs.readFileSync(referenceOutputPath, 'utf-8');

          if (!fileContent.startsWith('// @ts-nocheck')) {
            fileContent = `// @ts-nocheck\n${fileContent.replace(/^\uFEFF/, '')}`;
          }

          const scalarOverrides = {
            Mixed: 'any',
            Any: 'any',
            JSON: 'any',
            JSONObject: 'any',
          };

          for (const [scalarName, tsType] of Object.entries(scalarOverrides)) {
            fileContent = fileContent.replace(
              new RegExp(`export type ${scalarName} = unknown\\b`, 'g'),
              `export type ${scalarName} = ${tsType}`
            );
          }

          for (const op of operations) {
            // Built as an array of single-line template literals joined by '\n' rather than one
            // multi-line template literal: this file is itself written out via a bash heredoc,
            // and a plain multi-line template literal here would pick up THIS SCRIPT'S OWN
            // indentation as part of its string content, which would silently stop it from
            // byte-matching the real generated output. Each array element is single-line, so its
            // own leading source whitespace (outside the backticks) is not part of the value.
            const original = [
              `export function ${op}<Sel extends Selection<$RootTypes.${op}>>(`,
              `  selectFn: (q: $RootTypes.${op}) => [...Sel]`,
              `) {`,
              `  let field = new $Field<'${op}', GetOutput<Sel>, GetVariables<Sel>>('${op}', {`,
              `    selection: selectFn(new $Root.${op}()),`,
              `  })`,
              `  const str = fieldToQuery('${op}', field)`,
              ``,
              `  return gql(str) as any as TypedDocumentNode<GetOutput<Sel>, GetVariables<Sel>>`,
              `}`,
            ].join('\n');

            const patched = [
              `export function ${op}<Sel extends Selection<$RootTypes.${op}>>(name: string, selectFn: (q: $RootTypes.${op}) => [...Sel]): TypedDocumentNode<GetOutput<Sel>, GetVariables<Sel>>`,
              `export function ${op}<Sel extends Selection<$RootTypes.${op}>>(selectFn: (q: $RootTypes.${op}) => [...Sel]): TypedDocumentNode<GetOutput<Sel>, GetVariables<Sel>>`,
              `export function ${op}<Sel extends Selection<$RootTypes.${op}>>(nameOrFn: any, maybeSelectFn?: any) {`,
              `  const selectFn = typeof nameOrFn === 'function' ? nameOrFn : maybeSelectFn;`,
              `  const opName = typeof nameOrFn === 'string' ? nameOrFn : '${op}';`,
              `  let field = new $Field<'${op}', GetOutput<Sel>, GetVariables<Sel>>(opName as '${op}', {`,
              `    selection: selectFn(new $Root.${op}()),`,
              `  })`,
              `  const str = fieldToQuery(typeof nameOrFn === 'string' ? '${op} ' + opName : '${op}', field)`,
              ``,
              `  return gql(str) as any as TypedDocumentNode<GetOutput<Sel>, GetVariables<Sel>>`,
              `}`,
            ].join('\n');

            if (fileContent.includes(original)) {
              fileContent = fileContent.replace(original, patched);
            }
          }

          fs.writeFileSync(referenceOutputPath, fileContent, 'utf-8');
          console.log('Reference typed-graphql.ts written to', referenceOutputPath);
          CJS

          set +e
          node typed-graphql-drift-compare.cjs \
               "$RUNNER_TEMP/committed-schema.graphql" \
               "$RUNNER_TEMP/reference-typed-graphql.ts"
          builder_exit=$?
          set -e

          if [ "$builder_exit" -eq 2 ]; then
            echo "::error::Could not parse the committed schema.graphql, or typed-graphql-builder failed to run against it — this looks like a corrupted/malformed committed file, not typed-graphql.ts drift. See the log above for the underlying error."
            exit 1
          fi
          if [ "$builder_exit" -ne 0 ]; then
            echo "::error::typed-graphql-drift-compare.cjs failed unexpectedly (exit ${builder_exit})."
            exit 1
          fi

          if diff -q "$RUNNER_TEMP/committed-typed-graphql.ts" "$RUNNER_TEMP/reference-typed-graphql.ts" > /dev/null; then
            echo "OK: checked-in typed-graphql.ts matches what typed-graphql-builder produces from the checked-in schema.graphql."
            exit 0
          fi

          echo "::error::src/shared/generated/typed-graphql.ts is out of date relative to the committed schema.graphql (a typed-graphql-builder version bump, or an edit to scripts/generate-graph.mjs's patching logic, was not followed by 'npm run gengraph'). Run 'npm run gengraph' against the backend and commit the result."
          echo "--- typed-graphql.ts diff (committed -> regenerated from committed schema.graphql) ---"
          diff -u "$RUNNER_TEMP/committed-typed-graphql.ts" "$RUNNER_TEMP/reference-typed-graphql.ts" || true
          exit 1

      - name: Backend log (on failure)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/backend.log" || echo "No backend log was produced."
